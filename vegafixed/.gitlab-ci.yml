default:
  tags:
    - seng426

stages:
  - build
  - docker

variables:
  DOCKER_DRIVER: overlay2

# ------------------------
# Backend Build
# ------------------------
backend_build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd vega-spring
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - vega-spring/target/*.jar
  only:
    - main

# ------------------------
# Frontend Build
# ------------------------
frontend_build:
  stage: build
  image: node:16
  script:
    - cd vega-web
    - npm install
    - CI=false npm run build
  artifacts:
    paths:
      - vega-web/build/
  only:
    - main

# ------------------------
# Docker Build & Push
# ------------------------
docker_build:
  stage: docker
  image: docker:latest
  before_script:
    - echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin
  script:
    - docker build -t username/docker_repository_back:latest vega-spring
    - docker push username/docker_repository_back:latest
    - docker build -t username/docker_repository_front:latest vega-web
    - docker push username/docker_repository_front:latest